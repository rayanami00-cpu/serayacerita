<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>serayacerita - Selamat Datang</title>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #2a160a;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            background-repeat: repeat;
            color: #fff8eb;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .wood-card {
            background: rgba(43, 24, 16, 0.92);
            border: 2px solid #1a0f0a;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
        }
        .site-title {
            font-family: 'Berkshire Swash', cursive;
            font-size: 2.3rem;
            color: #fff8eb;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            text-transform: lowercase;
        }
        .input-group { 
            margin-bottom: 15px; 
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid #784822;
            background: #5c3517;
            color: #fff8eb;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .input-group input::placeholder { color: #d4b896; }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 0.9rem;
            user-select: none;
            opacity: 0.7;
        }
        .toggle-password:hover { opacity: 1; }
        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #8c532b;
            background: #784822;
            color: #fff8eb;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            transition: all 0.2s;
        }
        .btn-login:hover { background: #8c532b; }
        .btn-viewer {
            display: block;
            width: 100%;
            padding: 10px;
            color: #fff8eb;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.8;
        }
        .btn-viewer:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wood-card">
        <h1 class="site-title">serayacerita</h1>
        <form id="adminForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="email terdaftar" required autocomplete="email">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="password" required autocomplete="current-password">
                <span class="toggle-password" id="togglePassword">👁️</span>
            </div>
            <button type="submit" id="btnLogin" class="btn-login">login admin</button>
        </form>
        <a href="home.html" id="btnViewer" class="btn-viewer">view mode (pembaca)</a>
    </div>

    <script>
        // MASUKKAN URL DAN ANON KEY JWT SUPABASE (DARI MENU SETTINGS ⚙️ -> API)
        const SUPABASE_URL = "https://dtxzmilzgoengvthyhuk.supabase.co";
        const SUPABASE_KEY = "sb_secret_3p6RaV2FIc4zKrzCCcaRxw_NKuHh9M0"; 

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fitur Toggle Intip Password
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Logika Login Admin
        document.getElementById('adminForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById('email').value.trim();
            const passwordInputVal = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.innerText = "memproses...";

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: emailInput,
                password: passwordInputVal
            });

            if (error) {
                alert("Login gagal: " + error.message);
                btn.disabled = false;
                btn.innerText = "login admin";
            } else {
                localStorage.setItem('role', 'admin');
                window.location.href = "home.html";
            }
        });

        document.getElementById('btnViewer').addEventListener('click', function() {
            localStorage.setItem('role', 'viewer');
        });
    </script>
</body>
</html>
